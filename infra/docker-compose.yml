services:
  study-backend:
    build:
      context: ./server
    image: study-app-backend:latest
    container_name: study-backend
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - study-network
      - internet
    depends_on:
      study-mysql:
        condition: service_healthy

  study-nginx:
    image: nginx:alpine
    container_name: study-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./client-dist:/usr/share/nginx/html:ro
    networks:
      - study-network
      - internet
      - portal-internet
    depends_on:
      - study-backend

  study-mysql:
    image: mysql:8.0
    container_name: study-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-study_app_db}
    volumes:
      - study_mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "sh", "-c", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - study-network

volumes:
  study_mysql_data:
    name: study-app-mysql-data

networks:
  study-network:
    driver: bridge
  internet:
    driver: bridge
  portal-internet:
    external: true
    name: je1ght-platform_internet